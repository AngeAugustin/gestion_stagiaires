# Configuration de l'application
spring.application.name=Gestion des Stagiaires

# Configuration de la base de données H2
spring.datasource.url=jdbc:h2:file:./data/gestion-stagiaires-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuration Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Configuration des e-mails (utilisation d'une configuration pour le développement)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your-username
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuration de la session
server.servlet.session.timeout=30m

# Configuration des ressources statiques
spring.mvc.static-path-pattern=/static/**

# Configuration du port du serveur (défaut: 8080)
server.port=8080