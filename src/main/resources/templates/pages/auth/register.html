<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inscription')}">
    <title>Inscription</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Contenu -->
    <main class="flex-shrink-0 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="card-title mb-0"><i class="fas fa-user-plus me-2"></i>Inscription</h4>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/register}" method="post" th:object="${user}">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="prenom" class="form-label">Prénom</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                                            <input type="text" th:field="*{prenom}" class="form-control" id="prenom" 
                                                   placeholder="Entrez votre prénom" required>
                                        </div>
                                        <div class="text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="nom" class="form-label">Nom</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                                            <input type="text" th:field="*{nom}" class="form-control" id="nom" 
                                                   placeholder="Entrez votre nom" required>
                                        </div>
                                        <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                        <input type="email" th:field="*{email}" class="form-control" id="email" 
                                               placeholder="Entrez votre email" required>
                                    </div>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">Mot de passe</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" th:field="*{password}" class="form-control" id="password" 
                                               placeholder="Entrez votre mot de passe" required>
                                    </div>
                                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" 
                                               placeholder="Confirmez votre mot de passe" required>
                                    </div>
                                    <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-user-plus me-2"></i>S'inscrire
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer bg-light">
                            <div class="text-center">
                                Déjà un compte ? 
                                <a th:href="@{/login}" class="text-decoration-none">Se connecter</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
