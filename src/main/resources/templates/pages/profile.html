<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Mon Profil')}">
    <title>Mon Profil</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: layout('Mon Profil', ~{::section})}">
        <section>
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="card-title mb-0"><i class="fas fa-user-circle me-2"></i>Informations personnelles</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/profile/update}" method="post" th:object="${user}">
                                <input type="hidden" th:field="*{id}">
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="prenom" class="form-label">Prénom <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{prenom}" class="form-control" id="prenom" required>
                                        <div class="text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{nom}" class="form-control" id="nom" required>
                                        <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control" id="email" readonly>
                                    <small class="text-muted">L'adresse email ne peut pas être modifiée</small>
                                </div>
                                
                                <div class="card mb-4">
                                    <div class="card-header bg-light">
                                        <h5 class="card-title mb-0"><i class="fas fa-lock me-2"></i>Changer de mot de passe</h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label for="password" class="form-label">Nouveau mot de passe</label>
                                            <input type="password" th:field="*{password}" class="form-control" id="password">
                                            <small class="text-muted">Laissez vide pour conserver votre mot de passe actuel</small>
                                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="confirmPassword" class="form-label">Confirmer le nouveau mot de passe</label>
                                            <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword">
                                            <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Mettre à jour mon profil
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Informations sur les rôles -->
                    <div class="card mt-4 shadow-sm">
                        <div class="card-header bg-secondary text-white">
                            <h5 class="card-title mb-0"><i class="fas fa-user-tag me-2"></i>Vos rôles</h5>
                        </div>
                        <div class="card-body">
                            <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger me-2 p-2">
                                <i class="fas fa-shield-alt me-1"></i>Administrateur
                            </span>
                            <span sec:authorize="hasRole('USER')" class="badge bg-primary me-2 p-2">
                                <i class="fas fa-user me-1"></i>Utilisateur
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
