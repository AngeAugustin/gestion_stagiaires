<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Gestion des utilisateurs')}">
    <title>Gestion des utilisateurs</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: layout('Gestion des utilisateurs', ~{::section})}">
        <section>
            <!-- Barre d'outils -->
            <div class="mb-4">
                <a th:href="@{/admin/users/new}" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-1"></i>Nouvel utilisateur
                </a>
            </div>
            
            <!-- Tableau des utilisateurs -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Nom</th>
                                    <th>Prénom</th>
                                    <th>Email</th>
                                    <th>Rôles</th>
                                    <th>Statut</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${users.empty}">
                                    <td colspan="6" class="text-center">Aucun utilisateur trouvé</td>
                                </tr>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.nom}">Nom</td>
                                    <td th:text="${user.prenom}">Prénom</td>
                                    <td th:text="${user.email}">Email</td>
                                    <td>
                                        <span th:each="role : ${user.roles}" class="badge bg-secondary me-1" 
                                              th:text="${#strings.replace(role.name, 'ROLE_', '')}">Rôle</span>
                                    </td>
                                    <td>
                                        <span th:class="${user.enabled ? 'badge bg-success' : 'badge bg-danger'}" 
                                              th:text="${user.enabled ? 'Actif' : 'Inactif'}">Statut</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" 
                                               class="btn btn-outline-secondary" title="Modifier">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" 
                                               class="btn btn-outline-danger" title="Supprimer"
                                               th:if="${user.email != 'admin@gestionstagiaires.com'}"
                                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')">
                                                <i class="fas fa-trash-alt"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
