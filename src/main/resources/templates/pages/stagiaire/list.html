<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Liste des stagiaires')}">
    <title>Liste des stagiaires</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: layout('Liste des stagiaires', ~{::section})}">
        <section>
            <!-- Barre d'outils -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <a th:href="@{/stagiaire/new}" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i>Nouveau stagiaire
                    </a>
                </div>
                <div class="col-md-6">
                    <form th:action="@{/stagiaire/search}" method="get" class="d-flex">
                        <input type="text" name="keyword" class="form-control me-2" 
                               placeholder="Rechercher..." th:value="${keyword != null ? keyword : ''}">
                        <button class="btn btn-outline-secondary" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Filtres -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0"><i class="fas fa-filter me-2"></i>Filtres</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/stagiaire/list}" class="btn btn-sm btn-outline-primary">Tous</a>
                        <a th:href="@{/stagiaire/list(statut=EN_ATTENTE)}" class="btn btn-sm btn-outline-warning">En attente</a>
                        <a th:href="@{/stagiaire/list(statut=ACCEPTE)}" class="btn btn-sm btn-outline-success">Acceptés</a>
                        <a th:href="@{/stagiaire/list(statut=REFUSE)}" class="btn btn-sm btn-outline-danger">Refusés</a>
                        <a th:href="@{/stagiaire/list(statut=EN_COURS)}" class="btn btn-sm btn-outline-info">En cours</a>
                        <a th:href="@{/stagiaire/list(statut=TERMINE)}" class="btn btn-sm btn-outline-secondary">Terminés</a>
                    </div>
                </div>
            </div>
            
            <!-- Tableau des stagiaires -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Nom</th>
                                    <th>Prénom</th>
                                    <th>Email</th>
                                    <th>Formation</th>
                                    <th>Période</th>
                                    <th>Statut</th>
                                    <th>Encadrant</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${stagiaires.empty}">
                                    <td colspan="8" class="text-center">Aucun stagiaire trouvé</td>
                                </tr>
                                <tr th:each="stagiaire : ${stagiaires}">
                                    <td th:text="${stagiaire.nom}">Nom</td>
                                    <td th:text="${stagiaire.prenom}">Prénom</td>
                                    <td th:text="${stagiaire.email}">Email</td>
                                    <td th:text="${stagiaire.formation}">Formation</td>
                                    <td>
                                        <span th:if="${stagiaire.dateDebut != null}" 
                                              th:text="${#temporals.format(stagiaire.dateDebut, 'dd/MM/yyyy')}"></span>
                                        -
                                        <span th:if="${stagiaire.dateFin != null}" 
                                              th:text="${#temporals.format(stagiaire.dateFin, 'dd/MM/yyyy')}"></span>
                                    </td>
                                    <td>
                                        <span th:class="${
                                            stagiaire.statut.name() == 'EN_ATTENTE' ? 'badge bg-warning' : 
                                            stagiaire.statut.name() == 'ACCEPTE' ? 'badge bg-success' : 
                                            stagiaire.statut.name() == 'REFUSE' ? 'badge bg-danger' : 
                                            stagiaire.statut.name() == 'EN_COURS' ? 'badge bg-info' : 
                                            'badge bg-secondary'
                                        }" th:text="${stagiaire.statut.libelle}">Statut</span>
                                    </td>
                                    <td th:text="${stagiaire.encadrant != null ? stagiaire.encadrant.prenom + ' ' + stagiaire.encadrant.nom : '-'}">
                                        Encadrant
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/stagiaire/view/{id}(id=${stagiaire.id})}" 
                                               class="btn btn-outline-primary" title="Voir">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/stagiaire/edit/{id}(id=${stagiaire.id})}" 
                                               class="btn btn-outline-secondary" title="Modifier">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a sec:authorize="hasRole('ADMIN')" 
                                               th:href="@{/stagiaire/delete/{id}(id=${stagiaire.id})}"
                                               class="btn btn-outline-danger" title="Supprimer"
                                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce stagiaire ?')">
                                                <i class="fas fa-trash-alt"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
